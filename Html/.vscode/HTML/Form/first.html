<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>University Form</title>
  </head>
  <body>
    <h1>UniversityRegistration Form</h1>
      <p>Please fill out the form below to register.</p>
      <hr />
    <form>
      <h2>Personal Details</h2>
      <label  for="firstname">First Name:</label>
      <input type="text" id="firstname"  name="firstname" placeholder="e.g., Arjun"/>
      <br /><br />
      <label  for="lastname">Last Name:</label>
      <input type="text" id="lastname"  name="lastname" placeholder="e.g., Kumar"/>
      <br /><br />
      <label  for="DOB">Date of Birth:</label>
      <input type="date" id="DOB" name="DOB" />
      <br /><br />
      <label for="gender">Gender</label>
      <br />
      <input type="radio" id="male" name="gender" value="male" />
      <label  for="male">Male</label>

      <br />
      <input type="radio" id="female" name="gender" value="female" />
      <label  for="female">Female</label>

      <br />
      <input type="radio" id="other" name="gender" value="other" />
      <label  for="other">Other</label>

      <br /><br />
      <label  for="photo">Upload Your Photo:</label>
      <br />
      <input type="file" id="photo" name="photo" />
      <br /><br />
      <hr />
      <h2>Contact Information</h2>
      <label  for="email">Email Address:</label>
      <input type="email" id="email" name="email" placeholder="e.g., you@example.com" />
      <br /><br />
      <label  for="phone">Phone Number:</label>
      <input type="tel" id="phone" name="phone" placeholder="e.g., 9876543210" />
      <br /><br />
      <label  for="address">Mailing Address:</label>
      <br />
      <textarea id="address" name="address" rows="4" cols="20" placeholder="Street Address, City"></textarea>
      <br />
      <br />
      <hr />
      <h2>Academic Information</h2>
      <label  for="course">Select Your Course:</label>
      <br />
      <input type="" id="course" name="course" />
      <br /></br />
      <label  for="extraCurricular">ExtraCurricular Interests:</label>
      <br />
      <input type="checkbox" id="sports" name="extraCurricular" value="sports" />
      <label  for="sports">Sports</label>
      <br />
      <input type="checkbox" id="music" name="extraCurricular" value="music" />
      <label  for="music">Music & Arts</label>
      <br />
      <input type="checkbox" id="technologyClubs" name="extraCurricular" value="technologyClubs" />
      <label  for="technologyClubs"
        >Technology Clubs</label
      >
      <br />
      <input type="checkbox" id="volunteering" name="extraCurricular" value="volunteering" />
      <label  for="volunteering">Volunteering</label>
      <br /><br />
      <hr />
      <h2>Create Your Account</h2>
      <label  for="password">Create a Password:</label>
      <input type="password" id="password" name="password" />
      <br /><br />
      <label  for="securityQuestion">Security Question:</label>
      <br /><br />
      <label  for="securityAnswer">Security Answer:</label>
      <input type="password" id="securityAnswer" name="securityAnswer" />
      <br /><br />
      <input type="checkbox" id="Agree" name="Agree" value="Agree" />
      <label  for="Agree"
        >I agree to the terms and conditions.</label
      >
      <br /><br />
      <hr />
      <button type="submit">Register</button>
      <button type="reset">Clear Form</button>
    </form>
  </body>
</html>
